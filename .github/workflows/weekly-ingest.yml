name: Weekly Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingestion
        run: npm run ingest

      - name: Run archive
        run: npm run archive
